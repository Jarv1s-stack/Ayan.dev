<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fluctlight — разговор с Аяном</title>
<meta name="description" content="Поговори с Аяном в интерактивном световом поле Fluctlight." />
<meta name="theme-color" content="#04050b" />
<meta name="generator" content="Ayan.dev" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet" /> <!-- taste-skill-ignore: preserve Fluctlight's existing monospace brand type. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2340e6d0' stroke-width='1.2' stroke-dasharray='2 3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2378fff0'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<canvas id="stage" aria-label="Интерактивная световая сцена Fluctlight" role="img"></canvas>

<div id="noWebgl" hidden>
  <p>Для Fluctlight нужен WebGL. Включи аппаратное ускорение или открой страницу в другом браузере.</p>
</div>

<main class="experience" aria-label="Разговор с Аяном">
  <h1 class="sr-only">Fluctlight</h1>
  <output class="chat__reply" id="chatLog" aria-live="polite" aria-relevant="text"></output>
  <p class="sr-only" id="chatStatus" role="status" aria-live="polite">Готов к сообщению.</p>
  <form class="chat__row" id="chatForm" autocomplete="off">
    <input type="text" id="chatInput" class="chat__input" maxlength="2000" placeholder="Напиши мне…" aria-label="Сообщение Аяну" />
  </form>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
<script type="module" src="chat.js"></script>
</body>
</html>
